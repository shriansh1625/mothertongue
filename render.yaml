# Render Web Service. Free plan, no disk: creating this does not ask for a card.
# Dashboard path if you are not using Blueprint: New → Web Service → this repo → Free.
# Persistent disk (paid) is optional later: set DATA_DIR=/var/data and mount a disk there.
services:
  - type: web
    name: mothertongue
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: ./data
      - key: PAYPAL_ENV
        value: sandbox
      - key: SETTLE_THRESHOLD_CENTS
        value: "100"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: DEMO_BUYER_EMAIL
        sync: false
      - key: DEMO_BUYER_PASSWORD
        sync: false
